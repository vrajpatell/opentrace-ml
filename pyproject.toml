[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "opentrace-ml"
version = "0.2.0a1"
description = "Composable computer-vision, traffic-forecasting, and route-intelligence primitives."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Vraj Patel" }]
keywords = ["computer-vision", "traffic-forecasting", "geospatial", "routing", "machine-learning"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "joblib>=1.3",
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
]

[project.urls]
Homepage = "https://github.com/vrajpatell/opentrace-ml"
Repository = "https://github.com/vrajpatell/opentrace-ml"
Issues = "https://github.com/vrajpatell/opentrace-ml/issues"

[project.optional-dependencies]
data = ["ucimlrepo>=0.0.7"]
geo = ["osmnx>=2.0"]
dev = ["pytest>=8.0", "ruff>=0.6", "build>=1.2", "twine>=6.0", "jsonschema>=4.23"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
